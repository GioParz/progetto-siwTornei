<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista Squadre - SIWTornei</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-right">
            <span sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="login-link">Accedi</a>
            </span>
            <span sec:authorize="isAuthenticated()" class="user-menu">
                <span class="welcome-user">Ciao, <strong sec:authentication="name">Utente</strong>!</span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="logout-btn">Logout</button>
                </form>
            </span>
        </div>
    </div>

    <a th:href="@{/}" class="logo-wrapper">
        <img th:src="@{/images/logo.jpg}" alt="SIW Tornei Logo" class="logo-img">
    </a>

    <main class="main-content">
        <div>
            <div class="title-box">Club Partecipanti</div>
        </div>

        <!-- Solo l'ADMIN può registrare una nuova Squadra -->
        <div sec:authorize="hasAuthority('ADMIN')" class="margin-bottom-lg">
            <a th:href="@{/admin/squadra/new}" class="main-link admin-btn">Registra Nuova Squadra</a>
        </div>

        <!-- Tabella -->
        <table class="stadium-table table-centered">
            <thead>
                <tr>
                    <th>Nome Squadra</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="squadra : ${squadre}">
                    <td th:text="${squadra.nome}">Nome Squadra</td>
                    <td>
                        <div class="action-buttons-cell">
                            <a th:href="@{/squadra/{id}(id=${squadra.id})}" class="action-link-view">Visualizza</a>
                            
                            <!-- Azioni Admin -->
                            <a sec:authorize="hasAuthority('ADMIN')" 
                               th:href="@{/admin/squadra/{id}/edit(id=${squadra.id})}" 
                               class="action-link-edit">Modifica</a>
                               
							<form sec:authorize="hasAuthority('ADMIN')" th:action="@{/admin/squadra/{id}/delete(id=${squadra.id})}" method="post">
								<button type="submit" class="action-link-delete"
									onclick="return confirm('Cancellare definitivamente la squadra?')">Elimina</button>
							</form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

    </main>

</body>
</html>
